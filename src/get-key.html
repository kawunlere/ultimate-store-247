<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Your Key - Ultimate Store 24/7</title>
<meta name="monetag" content="8c65e44f884bece35ed56f60d7323722">
<script src="https://quge5.com/88/tag.min.js" data-zone="294019" async data-cfasync="false"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="navbar">
<a href="/" class="logo">Ultimate Store 24/7</a>
</div>

<div class="container" style="max-width:500px;margin:40px auto;padding:20px;">
  <h2 style="text-align:center;color:#ff5722;">Get Your Free Key</h2>
  
  <p style="text-align:center;margin:20px 0;">
    <a href="8ad.html" style="display:inline-block;background:#ff5722;color:#fff;padding:12px 25px;text-decoration:none;border-radius:5px;font-weight:bold;">Complete 8 Ad Steps to Get Free Key →</a>
  </p>

  <div id="loading" style="text-align:center;color:#999;padding:30px;">
    Reading your device ID...
  </div>
  
  <div id="error" style="display:none;background:#fee;padding:15px;border-radius:8px;color:#c00;text-align:center;"></div>
  
  <div id="keyBox" style="display:none;background:#fff;padding:25px;border-radius:8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
    <p style="color:#333;margin-bottom:10px;">Your Key (valid 2 days):</p>
    <div id="keyText" style="font-size:20px;font-weight:bold;color:#ff5722;font-family:monospace;padding:15px;background:#f5f5f5;border-radius:5px;word-break:break-all;"></div>
    <p style="color:#999;font-size:12px;margin-top:10px;">Copy this key and paste in your mod menu</p>
    <p id="expires" style="color:#666;font-size:12px;"></p>
  </div>
</div>

<script>
const API_URL = "https://ultimate-api.kawunlere.workers.dev";

const params = new URLSearchParams(window.location.search);
const deviceId = params.get('device');

if (!deviceId || deviceId.length < 5) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').innerText = 'Invalid device ID. Please open this page from your mod menu.';
} else {
  fetch(API_URL + '/api/generate-key', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deviceId: deviceId, type: 'free' })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    if (data.success) {
      document.getElementById('keyBox').style.display = 'block';
      document.getElementById('keyText').innerText = data.key;
      document.getElementById('expires').innerText = 'Expires: ' + new Date(data.expires).toLocaleString();
    } else {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').innerText = 'Error: ' + data.message;
    }
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').innerText = 'Network error. Please try again.';
  });
}
</script>
</body>
</html>
