<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Ultimate Store</title>
<meta name="monetag" content="8c65e44f884bece35ed56f60d7323722">
<script src="https://quge5.com/88/tag.min.js" data-zone="294019" async data-cfasync="false"></script>
<link rel="stylesheet" href="../css/style.css">
<style>
.admin-box { background: rgba(0,26,13,0.9); backdrop-filter: blur(8px); border: 1px solid #00ff41; border-radius: 8px; padding: 20px; margin: 15px auto; max-width: 700px; box-shadow: 0 0 20px rgba(0,255,65,0.3); }
.admin-box h2 { color: #00ff41; text-shadow: 0 0 8px #00ff41; margin-bottom: 15px; }
label { display: block; color: #00ff41; margin: 8px 0 4px; font-size: 13px; }
input, select, textarea { width: 100%; padding: 8px; background: #000; color: #00ff41; border: 1px solid #00ff41; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; box-sizing: border-box; }
input:focus, textarea:focus { box-shadow: 0 0 10px #00ff41; outline: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { padding: 10px 20px; background: rgba(0,26,13,0.85); color: #00ff41; border: 1px solid #00ff41; border-radius: 4px; cursor: pointer; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,65,0.3); }
.btn:hover { background: #00ff41; color: #000; }
.btn-danger { border-color: #f44336; color: #f44336; box-shadow: 0 0 10px rgba(244,67,54,0.3); }
.btn-danger:hover { background: #f44336; color: #fff; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #00802b; font-size: 12px; }
th { color: #00ff41; background: rgba(0,255,65,0.1); }
td { color: #00ff41; }
.admin-link { color: #00ff41; text-decoration: none; margin-right: 10px; cursor: pointer; }
.admin-link:hover { text-shadow: 0 0 5px #00ff41; }
.logout { color: #ff5722; cursor: pointer; float: right; }
.hidden { display: none; }
.error { color: #f44336; margin: 10px 0; }
.success { color: #4caf50; margin: 10px 0; }
.key-display { font-size: 18px; font-weight: bold; color: #00ff41; padding: 12px; background: #000; border: 1px solid #00ff41; border-radius: 4px; text-align: center; font-family: monospace; text-shadow: 0 0 8px #00ff41; word-break: break-all; }
.section-title { color: #00ff41; margin: 25px 0 12px; border-left: 3px solid #00ff41; padding-left: 10px; }
</style>
</head>
<body>
<div class="admin-box" id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="adminToken" placeholder="Enter Admin Token">
<button class="btn" onclick="login()" style="margin-top:10px;width:100%;">Login</button>
<p class="error" id="loginError"></p>
<a href="/" class="admin-link">← Back to site</a>
</div>

<div class="admin-box hidden" id="mainBox">
<h2>Admin Panel <span class="logout" onclick="logout()">Logout</span></h2>

<h3 class="section-title">Generate Key (Free or Premium)</h3>
<div class="row">
<div><label>Device ID</label><input type="text" id="keyDevice" placeholder="DT-ABC123..."></div>
<div>
<label>Type</label>
<select id="keyType">
<option value="free">Free (2 days)</option>
<option value="premium">Premium (30 days)</option>
</select>
</div>
</div>
<div class="row">
<div><label>Duration (days)</label><input type="text" id="keyDays" value="2"></div>
<div><label>&nbsp;</label><button class="btn" onclick="generateKey()">Generate Key</button></div>
</div>
<div id="keyResult" class="hidden">
<p>Key (copy and give to user):</p>
<div id="keyDisplay" class="key-display"></div>
<p id="keyExpires" style="color:#888;font-size:12px;margin-top:5px;"></p>
</div>

<h3 class="section-title">Add / Edit Item</h3>
<input type="hidden" id="editId">
<div class="row">
<div><label>Name</label><input type="text" id="itemName"></div>
<div><label>Category</label>
<select id="itemCategory">
<option value="tools">Tools</option>
<option value="apps">Apps</option>
<option value="games">Games</option>
<option value="mods">Mods</option>
</select>
</div>
</div>
<label>Image URL</label>
<input type="text" id="itemImage" placeholder="https://i.imgur.com/xxxxx.jpg">
<label>Description</label>
<textarea id="itemDesc" rows="3"></textarea>
<div class="row">
<div><label>Price</label><input type="text" id="itemPrice" placeholder="Free or $5"></div>
<div><label>Size</label><input type="text" id="itemSize" placeholder="15MB"></div>
</div>
<div class="row">
<div><label>Version</label><input type="text" id="itemVersion" placeholder="1.0"></div>
<div><label>Premium Only?</label>
<select id="itemPremium">
<option value="false">No (Free)</option>
<option value="true">Yes (Premium)</option>
</select>
</div>
</div>
<label>Download URL</label>
<input type="text" id="itemDownload" placeholder="https://drive.google.com/file/...">
<button class="btn" onclick="saveItem()" style="margin-top:15px;width:100%;">Save Item</button>
<p class="success" id="saveMsg"></p>

<h3 class="section-title">All Items</h3>
<table id="itemsTable">
<thead><tr><th>Name</th><th>Cat</th><th>Premium</th><th>Actions</th></tr></thead>
<tbody id="itemsBody"></tbody>
</table>

<h3 class="section-title">Add Scrolling Ad</h3>
<input type="text" id="adText" placeholder="Ad text shown in scrolling bar">
<input type="text" id="adLink" placeholder="https://link.com" style="margin-top:5px;">
<button class="btn" onclick="saveAd()" style="margin-top:10px;">Save Ad</button>

<h3 class="section-title">Current Ads</h3>
<div id="adsList"></div>

<br><a href="/" class="admin-link">← Back to site</a>
</div>

<script>
const API_ITEMS = "https://ultimate-items.kawunlere.workers.dev";
const API_KEYS = "https://ultimate-api.kawunlere.workers.dev";
let token = localStorage.getItem('adminToken') || '';
function login() {
  token = document.getElementById('adminToken').value;
  fetch(API_ITEMS + '/api/admin/list', { headers: { 'X-Admin-Token': token } })
    .then(r => { if (r.status === 401) throw new Error('Wrong token'); return r.json(); })
    .then(() => { localStorage.setItem('adminToken', token); showMain(); })
    .catch(e => { document.getElementById('loginError').innerText = 'Invalid token'; });
}
function logout() { localStorage.removeItem('adminToken'); token = ''; location.reload(); }
function showMain() {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('mainBox').classList.remove('hidden');
  loadItems();
  loadAds();
  loadKeys();
}
function generateKey() {
  const deviceId = document.getElementById('keyDevice').value;
  const type = document.getElementById('keyType').value;
  const days = document.getElementById('keyDays').value;
  if (!deviceId) { alert('Enter device ID'); return; }
  const endpoint = type === 'premium' ? API_KEYS + '/api/admin/generate-premium' : API_KEYS + '/api/admin/generate-free';
  fetch(endpoint, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: JSON.stringify({ deviceId, days: parseInt(days) || 2 })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      document.getElementById('keyDisplay').innerText = data.key;
      document.getElementById('keyExpires').innerText = 'Expires: ' + new Date(data.expires).toLocaleString() + ' | Type: ' + data.type;
      document.getElementById('keyResult').classList.remove('hidden');
    } else { alert('Error: ' + (data.error || 'Failed')); }
  })
  .catch(e => alert('Error: ' + e.message));
}
function loadKeys() {
  fetch(API_KEYS + '/api/admin/list', { headers: { 'X-Admin-Token': token } })
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('adsList');
      let html = '';
      (data.keys || []).forEach(k => {
        if (!k.deviceId.startsWith('DT-')) return;
        const expired = new Date(k.expires) < new Date();
        html += '<div style="padding:8px;border-bottom:1px solid #00802b;font-size:12px;">';
        html += '<span style="color:#00ff41;">' + (k.deviceId || '').substring(0, 12) + '...</span> ';
        html += '<span style="color:#888;">' + (k.type || '') + '</span> ';
        html += '<span style="color:' + (expired ? '#f44336' : '#4caf50') + ';">' + (expired ? 'EXPIRED' : 'ACTIVE') + '</span> ';
        html += '<a class="admin-link" onclick="deleteKey(\\'' + k.deviceId + '\\')" style="color:#f44336;float:right;">Delete</a>';
        html += '</div>';
      });
      const existing = el.innerHTML;
      el.innerHTML = html + (html ? '<hr style="border-color:#00802b;margin:10px 0;">' : '') + existing;
    })
    .catch(() => {});
}
function deleteKey(deviceId) {
  if (!confirm('Delete key for ' + deviceId + '?')) return;
  fetch(API_KEYS + '/api/admin/delete/' + encodeURIComponent(deviceId), { method: 'DELETE', headers: { 'X-Admin-Token': token } })
    .then(() => loadKeys());
}
function loadItems() {
  fetch(API_ITEMS + '/api/items')
    .then(r => r.json())
    .then(data => {
      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      (data.items || []).forEach(item => {
        tbody.innerHTML += '<tr><td>' + item.name + '</td><td>' + item.category + '</td><td>' + (item.premium ? 'Yes' : 'No') + '</td><td><a class="admin-link" onclick="editItem(\\'' + item.id + '\\')">Edit</a><a class="admin-link" onclick="deleteItem(\\'' + item.id + '\\')" style="color:#f44336;">Delete</a></td></tr>';
      });
    });
}
function clearForm() {
  ['itemName','itemImage','itemDesc','itemPrice','itemSize','itemVersion','itemDownload'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('editId').value = '';
  document.getElementById('itemCategory').value = 'tools';
  document.getElementById('itemPremium').value = 'false';
}
function saveItem() {
  const id = document.getElementById('editId').value;
  const data = {
    name: document.getElementById('itemName').value,
    category: document.getElementById('itemCategory').value,
    image: document.getElementById('itemImage').value,
    description: document.getElementById('itemDesc').value,
    price: document.getElementById('itemPrice').value,
    size: document.getElementById('itemSize').value,
    version: document.getElementById('itemVersion').value,
    premium: document.getElementById('itemPremium').value === 'true',
    downloadUrl: document.getElementById('itemDownload').value
  };
  const url = id ? API_ITEMS + '/api/items/' + id : API_ITEMS + '/api/items';
  const method = id ? 'PUT' : 'POST';
  fetch(url, {
    method, headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(() => { document.getElementById('saveMsg').innerText = 'Saved!'; clearForm(); loadItems(); })
  .catch(e => document.getElementById('saveMsg').innerText = 'Error: ' + e.message);
}
function editItem(id) {
  fetch(API_ITEMS + '/api/items').then(r => r.json()).then(data => {
    const item = data.items.find(i => i.id === id);
    if (!item) return;
    document.getElementById('editId').value = item.id;
    document.getElementById('itemName').value = item.name || '';
    document.getElementById('itemCategory').value = item.category || 'tools';
    document.getElementById('itemImage').value = item.image || '';
    document.getElementById('itemDesc').value = item.description || '';
    document.getElementById('itemPrice').value = item.price || '';
    document.getElementById('itemSize').value = item.size || '';
    document.getElementById('itemVersion').value = item.version || '';
    document.getElementById('itemPremium').value = item.premium ? 'true' : 'false';
    document.getElementById('itemDownload').value = item.downloadUrl || '';
    window.scrollTo(0, 0);
  });
}
function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  fetch(API_ITEMS + '/api/items/' + id, { method: 'DELETE', headers: { 'X-Admin-Token': token } })
    .then(() => loadItems());
}
function saveAd() {
  const text = document.getElementById('adText').value;
  const link = document.getElementById('adLink').value;
  if (!text) return;
  fetch(API_ITEMS + '/api/ads', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: JSON.stringify({ text, link })
  }).then(() => { document.getElementById('adText').value = ''; document.getElementById('adLink').value = ''; loadAds(); });
}
function loadAds() {
  fetch(API_ITEMS + '/api/ads').then(r => r.json()).then(data => {
    const el = document.getElementById('adsList');
    let html = '';
    (data.ads || []).forEach(ad => {
      html += '<div style="padding:8px;border-bottom:1px solid #00802b;"><span>' + ad.text + '</span> <a class="admin-link" onclick="deleteAd(\\'' + ad.id + '\\')" style="color:#f44336;float:right;">Delete</a></div>';
    });
    el.innerHTML = html;
  });
}
function deleteAd(id) {
  fetch(API_ITEMS + '/api/ads/' + id, { method: 'DELETE', headers: { 'X-Admin-Token': token } })
    .then(() => loadAds());
}
if (token) {
  fetch(API_ITEMS + '/api/admin/list', { headers: { 'X-Admin-Token': token } })
    .then(r => { if (r.ok) showMain(); else localStorage.removeItem('adminToken'); })
    .catch(() => localStorage.removeItem('adminToken'));
}
</script>
</body>
</html>
