<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item - Ultimate Store 24/7</title>
<meta name="monetag" content="8c65e44f884bece35ed56f60d7323722">
<script src="https://quge5.com/88/tag.min.js" data-zone="294019" async data-cfasync="false"></script>
<link rel="stylesheet" href="css/style.css">
<style>
.detail { background:#fff; border-radius:10px; padding:20px; margin:20px auto; max-width:600px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
.detail img { width:100%; max-width:300px; border-radius:8px; margin:0 auto 15px; display:block; }
.detail h1 { color:#ff5722; margin-bottom:10px; }
.detail .meta { color:#999; font-size:13px; margin-bottom:15px; }
.detail .desc { color:#333; line-height:1.6; margin-bottom:20px; }
.btn-download { display:inline-block; padding:15px 30px; background:#4caf50; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; }
.btn-locked { background:#999; cursor:not-allowed; }
.back { display:inline-block; margin-top:20px; color:#ff5722; text-decoration:none; }
</style>
</head>
<body>
<header class="topbar">
<a href="/" class="logo">Ultimate Store 24/7</a>
</header>

<div id="loading" style="text-align:center;padding:40px;color:#999;">Loading...</div>

<div id="content" style="display:none;">
  <div class="detail">
    <img id="img" src="" alt="">
    <h1 id="name"></h1>
    <div class="meta">
      <span id="price"></span> · <span id="size"></span> · <span id="version"></span>
    </div>
    <div class="desc" id="desc"></div>
    <a id="dlBtn" class="btn-download" href="#">Download</a>
    <br>
    <a class="back" href="/">← Back to home</a>
  </div>
</div>

<script>
const ITEMS_API = "https://ultimate-items.kawunlere.workers.dev";

const params = new URLSearchParams(window.location.search);
const itemId = params.get('id');

if (!itemId) {
  document.getElementById('loading').innerText = 'No item ID';
} else {
  fetch(ITEMS_API + '/api/items')
    .then(r => r.json())
    .then(data => {
      const item = data.items.find(i => i.id === itemId);
      if (!item) {
        document.getElementById('loading').innerText = 'Item not found';
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.getElementById('img').src = item.image || 'https://via.placeholder.com/300';
      document.getElementById('name').innerText = item.name;
      document.getElementById('price').innerText = item.price;
      document.getElementById('size').innerText = item.size || 'N/A';
      document.getElementById('version').innerText = item.version || 'N/A';
      document.getElementById('desc').innerText = item.description || 'No description.';
      
      const dlBtn = document.getElementById('dlBtn');
      if (item.premium) {
        dlBtn.innerText = 'Premium Only';
        dlBtn.classList.add('btn-locked');
        dlBtn.href = '#';
        dlBtn.onclick = (e) => { e.preventDefault(); alert('This is a premium tool. Subscribe to access.'); };
      } else {
        dlBtn.innerText = 'Download';
        dlBtn.href = item.downloadUrl || '#';
        dlBtn.target = '_blank';
      }
    })
    .catch(err => {
      document.getElementById('loading').innerText = 'Network error';
    });
}
</script>
</body>
</html>
